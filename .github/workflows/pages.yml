# Pubblica la mappa interattiva dell'architettura (docs/mappa/out/index/) su GitHub Pages:
# https://lufo-336.github.io/under-the-sun/
name: Pubblica mappa D2 (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - docs/mappa/out/index/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/mappa/out/index
      - id: deployment
        uses: actions/deploy-pages@v4
