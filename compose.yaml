# Per ora solo il database. backend, frontend e batch si aggiungono
# quando esistono le loro cartelle (vedi docs/architettura-devops, sez. 5.2).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copia .env.example in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copia .env.example in .env}
      POSTGRES_DB: ${POSTGRES_DB:?copia .env.example in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - dati-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applica le migrazioni nuove di db/migrations e si spegne.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.38.1
    working_dir: /repo
    command: ["--wait", "--no-dump-schema", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ./db:/repo/db:ro,z   # z: serve solo con SELinux (Fedora), altrove è ignorato
    depends_on:
      db:
        condition: service_healthy

  # A richiesta: docker compose run --rm seed
  seed:
    image: postgres:17
    profiles: ["strumenti"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./db/seed:/seed:ro,z
      - ./data/${CARTELLA_CSV:-esempi}:/csv:ro,z
    command: ["sh", "-c", "psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1 --single-transaction -f /seed/carica.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  dati-db:
